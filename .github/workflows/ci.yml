name: CI

on:
  pull_request:
    # "labeled" exists only so adding the ui-tests label starts ui-tests; see the job conditions below.
    # No paths-ignore here: main requires linux and ios-build, and a PR that starts no run could never merge.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
    paths-ignore: ['Docs/**', '**/*.md', '.claude/**']
  workflow_dispatch:
    inputs:
      region:
        description: Bundle full Seattle data for the UI suite instead of the fixture
        type: boolean
        default: false

# A newer run on the same branch or PR cancels the older one, on main too; the newest commit always runs.
# Docs-only pushes start no run, so they cancel nothing. Label events get their own groups so they never cancel a code run:
# the ui-tests label has one per PR, any other label a group of its own (its jobs are all skipped).
concurrency:
  group: >-
    ${{ github.event.action == 'labeled'
    && (github.event.label.name == 'ui-tests' && format('ci-ui-label-{0}', github.ref) || format('ci-other-label-{0}', github.run_id))
    || format('ci-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  # Cheap and fast: importer, data reproduction and Core's Swift tests, the same checks a cloud session runs.
  linux:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    container: swift:6.4.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends libsqlite3-dev zlib1g-dev python3
      - run: Scripts/verify.sh

  # The reports Worker (Backend/): handlers under node against in-memory SQLite. No Cloudflare account or secrets.
  backend:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit

  # The iOS app build, on every PR push (not on label events: the head already ran it). The UI suite runs only when asked,
  # since it is the slowest job. xcode-27 is a standard runner: free in a public repo, 3 cores and 7 GB.
  ios-build:
    if: github.event.action != 'labeled'
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ hashFiles('Peoplemaps.xcodeproj/project.pbxproj', 'Package.swift') }}
      - run: PEOPLEMAPS_XCODE="$(xcode-select -p)" Scripts/verify.sh

  # Push to main, a manual run, or a PR labelled "ui-tests". Its screenshots land in the run's "ui-screenshots" artifact.
  ui-tests:
    if: github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ui-tests') && (github.event.action != 'labeled' || github.event.label.name == 'ui-tests'))
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ hashFiles('Peoplemaps.xcodeproj/project.pbxproj', 'Package.swift') }}
      - if: inputs.region
        run: Scripts/fetch_data seattle-all
      - run: PEOPLEMAPS_XCODE="$(xcode-select -p)" PEOPLEMAPS_UI_RESULT="$RUNNER_TEMP/ui-tests.xcresult" Scripts/verify.sh --fast --ui
      - if: always()
        run: xcrun xcresulttool export attachments --path "$RUNNER_TEMP/ui-tests.xcresult" --output-path "$RUNNER_TEMP/ui-screenshots"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: ${{ runner.temp }}/ui-screenshots
          retention-days: 7
